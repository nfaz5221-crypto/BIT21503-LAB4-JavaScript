<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 1 - Change Paragraph Text</title>
</head>
<body>
  <div id="myElement">
    <p>Welcome to my website!</p>
  </div>

  <script>
    // Change the paragraph text automatically when the page loads
    window.onload = function () {
      document.querySelector("#myElement p").innerHTML = "Hello there!";
    };
  </script>
</body>
</html>
